name: PR to main [Run tests]

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests ${{ matrix.os }} py-${{ matrix.py-version}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        py-version: [ '3.10', '3.11', '3.12' ]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.py-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.py-version }}

      - name: Install pyscf-ac0
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install gcc
          echo "FC=$(brew --prefix)/bin/gfortran" >> $GITHUB_ENV
          python -m pip install --upgrade pip
          python -m pip install -v .

      - name: Install pyscf-ac0
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libblas-dev liblapack-dev
          echo "FC=gfortran" >> $GITHUB_ENV
          python -m pip install --upgrade pip
          python -m pip install -v .

      - name: Test with pytest
        run: |
          python -m pip install -r tests/test-requirements.txt
          pytest 
